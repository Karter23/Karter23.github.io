<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Imperium // Loading</title>
<style>
  :root{
    --void:      #08090b;
    --panel:     #131519;
    --panel-2:   #1b1e24;
    --steel:     #464b54;
    --steel-lo:  #2a2d33;
    --red:       #a11313;
    --red-lo:    #5c0c0c;
    --text-hi:   #e7e9ec;
    --text-lo:   #7d828c;
    --mono: "Consolas", "SFMono-Regular", "Segoe UI Mono", monospace;
    --sans: "Bahnschrift", "Segoe UI Semibold", "Segoe UI", Arial, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:var(--sans);
    color:var(--text-hi);
  }

  /* ---------- background ---------- */

  #stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #6b6f77 100%, transparent),
      radial-gradient(1px 1px at 65% 12%, #565a61 100%, transparent),
      radial-gradient(1px 1px at 80% 70%, #6b6f77 100%, transparent),
      radial-gradient(1px 1px at 35% 80%, #4b4e54 100%, transparent),
      radial-gradient(1px 1px at 90% 40%, #565a61 100%, transparent),
      radial-gradient(1px 1px at 10% 65%, #4b4e54 100%, transparent),
      radial-gradient(1px 1px at 50% 50%, #6b6f77 100%, transparent),
      radial-gradient(1px 1px at 75% 90%, #4b4e54 100%, transparent);
    background-repeat:repeat;
    background-size: 340px 340px;
    opacity:.55;
  }

  #vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(8,9,11,.2) 0%, rgba(8,9,11,0) 20%, rgba(8,9,11,0) 70%, rgba(8,9,11,.9) 100%);
  }

  #grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(120,20,20,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,20,20,.06) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: linear-gradient(180deg, transparent 0%, black 30%, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 30%, black 70%, transparent 100%);
  }

  /* sweeping scan line, single deliberate motion */
  #scan{
    position:absolute; left:0; right:0; height:140px;
    background:linear-gradient(180deg, rgba(161,19,19,0) 0%, rgba(161,19,19,.06) 50%, rgba(161,19,19,0) 100%);
    animation: sweep 9s linear infinite;
  }
  @keyframes sweep{
    0%   { top:-140px; }
    100% { top:100%; }
  }

  /* ---------- layout ---------- */

  #frame{
    position:relative;
    width:100%; height:100%;
  }

  .corner{
    position:absolute; width:34px; height:34px;
    border-color:var(--steel);
    opacity:.85;
  }
  .corner.tl{ top:22px; left:22px; border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:22px; right:22px; border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:22px; left:22px; border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:22px; right:22px; border-bottom:2px solid; border-right:2px solid; }

  /* top bar: server identity */
  #topbar{
    position:absolute; top:36px; left:64px; right:64px;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  #server-block .label{
    font-family:var(--mono); font-size:11px; letter-spacing:2px;
    color:var(--text-lo);
  }
  #server-name{
    font-size:22px; font-weight:600; letter-spacing:.5px;
    margin-top:4px;
    color:var(--text-hi);
  }
  #act-label{
    margin-top:6px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--red);
  }
  #gamemode-block{ text-align:right; }
  #gamemode-block .label{
    font-family:var(--mono); font-size:11px; letter-spacing:2px;
    color:var(--text-lo);
  }
  #gamemode-name{
    font-size:16px; margin-top:4px; color:var(--text-hi); font-weight:600;
  }

  /* center emblem + title */
  #center{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-58%);
    text-align:center;
    width:640px;
  }

  #emblem{
    width:120px; height:120px; margin:0 auto 22px;
    object-fit:contain;
    filter: drop-shadow(0 0 18px rgba(161,19,19,.45));
  }

  #title{
    font-size:34px;
    font-weight:700;
    letter-spacing:8px;
    color:var(--text-hi);
    text-shadow: 0 0 26px rgba(161,19,19,.35);
    white-space:nowrap;
  }
  #title span{ color:var(--red); }

  #credit{
    margin-top:8px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--text-lo);
    opacity:.8;
  }

  #subtitle{
    margin-top:14px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:4px;
    color:var(--text-lo);
  }

  /* map readout, sits quietly under emblem block */
  #map-readout{
    margin-top:26px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:6px 16px;
    border:1px solid var(--steel-lo);
    background:rgba(255,255,255,.02);
  }
  #map-readout .dot{
    width:6px; height:6px; background:var(--red); border-radius:50%;
    box-shadow:0 0 8px var(--red);
  }
  #map-name{
    font-family:var(--mono); font-size:12px; letter-spacing:1.5px; color:var(--text-hi);
  }

  /* bottom hud: progress + status + tip */
  #bottom{
    position:absolute; left:64px; right:64px; bottom:52px;
  }

  #status-row{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  #status-text{
    font-family:var(--mono); font-size:12px; letter-spacing:1.5px;
    color:var(--text-hi);
  }
  #percent{
    font-family:var(--mono); font-size:12px; letter-spacing:1.5px;
    color:var(--red);
  }

  #bar-outer{
    width:100%; height:6px;
    background:var(--panel-2);
    border:1px solid var(--steel-lo);
    position:relative;
    overflow:hidden;
  }
  #bar-inner{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--red-lo), var(--red));
    transition:width .35s ease-out;
    box-shadow:0 0 12px rgba(161,19,19,.6);
  }
  #bar-ticks{
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 1px, transparent 1px 22px);
    pointer-events:none;
  }

  #tip-row{
    margin-top:16px;
    display:flex; justify-content:space-between; align-items:center;
  }
  #tip{
    font-size:12px; color:var(--text-lo);
    max-width:70%;
  }
  #tip b{ color:var(--text-hi); font-weight:600; }

  #steamid-block{
    font-family:var(--mono); font-size:11px; color:var(--text-lo); letter-spacing:1px;
    text-align:right;
  }

  @media (max-width: 900px){
    #title{ font-size:32px; letter-spacing:9px; }
    #center{ width:88%; }
    #topbar, #bottom{ left:28px; right:28px; }
  }
</style>
</head>

<script>
  // ---- Ladehinweise, rotieren im Hintergrund ----
  var tips = [
    "<b>Disziplin</b> ist die Grundlage jeder erfolgreichen Ordnung.",
    "Offiziere melden Regelverstoesse ueber das Server-Forum, nicht im Chat.",
    "Ausweichmanoever verbrauchen Ausdauer &mdash; plane deine Bewegungen.",
    "Das Regelwerk findest du jederzeit im Server-Discord.",
    "Loyalitaet wird belohnt. Verrat wird nicht vergessen.",
    "Technische Probleme? Wende dich an ein Admin-Mitglied deines Vertrauens."
  ];
  var tipEl = document.getElementById('tip');
  var tipIndex = 0;
  function rotateTip(){
    tipEl.innerHTML = tips[tipIndex % tips.length];
    tipIndex++;
  }
  rotateTip();
  setInterval(rotateTip, 5000);

  // ---- interne Helfer ----
  var statusEl   = document.getElementById('status-text');
  var percentEl  = document.getElementById('percent');
  var barEl      = document.getElementById('bar-inner');
  var mapEl      = document.getElementById('map-name');
  var serverEl   = document.getElementById('server-name');
  var gamemodeEl = document.getElementById('gamemode-name');
  var steamidEl  = document.getElementById('steamid-text');

  function setProgress(pct){
    pct = Math.max(0, Math.min(100, pct));
    barEl.style.width = pct + '%';
    percentEl.textContent = Math.round(pct) + '%';
  }

  // ---------------------------------------------------------
  // GMod ruft diese globalen Funktionen automatisch auf.
  // Reihenfolge/Namen entsprechen der offiziellen Loadingscreen-API.
  // ---------------------------------------------------------

  // wird beim Start mit Server-/Map-Infos aufgerufen
  window.GameDetails = function(serverName, serverUrl, mapName, maxPlayers, steamId, gamemodeName){
    serverEl.textContent   = serverName || "Unbekannter Server";
    mapEl.textContent      = mapName || "unbekannt";
    gamemodeEl.textContent = gamemodeName || "Sandbox";
    steamidEl.textContent  = "STEAMID " + (steamId || "-");
  };

  // wird bei jedem Statuswechsel aufgerufen ("Sende Client-Info" etc.)
  window.SetStatusChanged = function(status){
    if (!status) return;
    statusEl.textContent = String(status).toUpperCase();
    bumpProgress();
  };

  // manche Server-Addons rufen stattdessen/zusaetzlich SetFilter
  window.SetFilter = function(text){
    if (text) statusEl.textContent = String(text).toUpperCase();
  };

  // interner Fallback-Fortschritt: steigt an, solange echte Events reinkommen,
  // bleibt aber nie bei 0 stehen, falls der Server keine Prozentwerte liefert
  var fakeProgress = 0;
  function bumpProgress(){
    fakeProgress = Math.min(96, fakeProgress + 6 + Math.random() * 10);
    setProgress(fakeProgress);
  }

  // ---------------------------------------------------------
  // Vorschau-/Offline-Modus: simuliert einen Ladevorgang, falls
  // die Seite ausserhalb von GMod (z.B. im Browser) geoeffnet wird.
  // ---------------------------------------------------------
  var isPreview = (typeof window.GameDetails === 'function');
  (function demo(){
    window.GameDetails("Imperium Roleplay #1 | Coreward Sector", "", "gm_construct_imperial", 64, "STEAM_0:1:XXXXXXX", "DarkRP");
    var steps = [
      "Verbindung wird hergestellt",
      "Sende Client-Informationen",
      "Empfange Serverregeln",
      "Lade Ressourcen",
      "Synchronisiere Entitaeten",
      "Fast geschafft"
    ];
    var i = 0;
    var iv = setInterval(function(){
      if (i >= steps.length){ clearInterval(iv); setProgress(100); statusEl.textContent = "BEREIT"; return; }
      window.SetStatusChanged(steps[i]);
      i++;
    }, 1400);
  })();
</script>
